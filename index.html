<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랜덤 룰렛 돌리기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Canvas-Confetti CDN for celebration effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-pink-500 to-indigo-400 mb-2">
        <i class="fa-solid fa-dharmachakra mr-2"></i>랜덤 룰렛 돌리기
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">원하는 항목을 자유롭게 등록하고 룰렛을 돌려보세요!</p>
    </header>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start flex-1">
      
      <!-- Left Column: Roulette Wheel Display & Controls -->
      <div class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-800/60 backdrop-blur border border-slate-700/60 rounded-3xl p-6 shadow-2xl relative overflow-hidden min-h-[480px]">
        
        <!-- Pointer Arrow (Top Center) -->
        <div class="relative z-20 flex flex-col items-center -mb-4">
          <div class="w-8 h-10 bg-gradient-to-b from-rose-500 to-red-600 rounded-t-md shadow-lg flex items-center justify-center border border-rose-300 transform drop-shadow-[0_4px_10px_rgba(244,63,94,0.6)]"
               style="clip-path: polygon(0 0, 100% 0, 50% 100%); width: 36px; height: 42px;">
          </div>
        </div>

        <!-- Wheel Canvas Container -->
        <div class="relative flex items-center justify-center my-2 p-2 rounded-full bg-slate-900/80 border-4 border-slate-700/80 shadow-inner">
          <canvas ref="rouletteCanvas" width="420" height="420" class="max-w-full h-auto transition-transform duration-75"></canvas>
          
          <!-- Center Pin / Spin Button Over Center -->
          <button 
            @click="spinRoulette" 
            :disabled="isSpinning || validItems.length < 2"
            class="absolute z-10 w-20 h-20 rounded-full bg-gradient-to-tr from-amber-500 to-amber-300 text-slate-950 font-black text-lg shadow-[0_0_25px_rgba(245,158,11,0.5)] border-4 border-slate-900 flex items-center justify-center hover:scale-105 active:scale-95 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
            {{ isSpinning ? '회전중' : 'START' }}
          </button>
        </div>

        <!-- Spin & Reset Control Buttons -->
        <div class="mt-6 flex flex-wrap gap-4 justify-center w-full max-w-sm">
          <button 
            @click="spinRoulette" 
            :disabled="isSpinning || validItems.length < 2"
            class="flex-1 py-3 px-6 rounded-xl bg-gradient-to-r from-amber-500 to-pink-500 text-white font-bold shadow-lg hover:from-amber-400 hover:to-pink-400 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i>
            <span>{{ isSpinning ? '돌아가는 중...' : '룰렛 돌리기' }}</span>
          </button>
          
          <button 
            @click="resetRotation" 
            :disabled="isSpinning"
            class="py-3 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
            title="위치 초기화">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>

        <!-- Winner Modal / Result Display -->
        <div v-if="winner" class="mt-6 w-full max-w-md bg-gradient-to-r from-indigo-900/80 to-purple-900/80 border border-indigo-500/50 rounded-2xl p-4 text-center animate-bounce shadow-xl">
          <div class="text-xs font-semibold text-indigo-300 uppercase tracking-widest mb-1">🎉 당첨 결과 🎉</div>
          <div class="text-2xl sm:text-3xl font-black text-amber-300 drop-shadow-md break-words">
            "{{ winner }}"
          </div>
        </div>

      </div>

      <!-- Right Column: N-Input Item Manager -->
      <div class="lg:col-span-5 flex flex-col bg-slate-800/60 backdrop-blur border border-slate-700/60 rounded-3xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold flex items-center gap-2 text-slate-100">
            <i class="fa-solid fa-list-check text-indigo-400"></i>
            항목 목록 (총 {{ validItems.length }}개)
          </h2>
          <div class="flex gap-2">
            <button 
              @click="setPreset('food')" 
              class="text-xs px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition">
              🍔 점심메뉴
            </button>
            <button 
              @click="setPreset('penalty')" 
              class="text-xs px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition">
              🎯 벌칙게임
            </button>
          </div>
        </div>

        <!-- Mode Switch: Direct Input vs Bulk Textarea -->
        <div class="flex bg-slate-900/60 p-1 rounded-xl mb-4 text-xs font-semibold text-slate-400">
          <button 
            @click="inputMode = 'list'" 
            :class="{'bg-indigo-600 text-white shadow': inputMode === 'list'}"
            class="flex-1 py-1.5 rounded-lg transition">개별 입력</button>
          <button 
            @click="inputMode = 'bulk'" 
            :class="{'bg-indigo-600 text-white shadow': inputMode === 'bulk'}"
            class="flex-1 py-1.5 rounded-lg transition">일괄 입력 (줄바꿈)</button>
        </div>

        <!-- List View Input -->
        <div v-if="inputMode === 'list'" class="flex flex-col flex-1">
          <!-- Add Single Item Box -->
          <form @submit.prevent="addItem" class="flex gap-2 mb-4">
            <input 
              v-model="newItemText" 
              type="text" 
              placeholder="새 항목을 입력하세요 (Enter)" 
              class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-slate-100 transition"
              maxlength="25"
            />
            <button 
              type="submit" 
              class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-1 active:scale-95">
              <i class="fa-solid fa-plus"></i> 추가
            </button>
          </form>

          <!-- Scrollable Item List -->
          <div class="max-h-[320px] overflow-y-auto space-y-2 pr-1 custom-scrollbar flex-1">
            <div 
              v-for="(item, index) in items" 
              :key="index"
              class="flex items-center gap-2 bg-slate-900/70 border border-slate-700/50 rounded-xl px-3 py-2 transition group hover:border-slate-600">
              
              <!-- Color Indicator -->
              <div 
                class="w-4 h-4 rounded-full flex-shrink-0 shadow-sm"
                :style="{ backgroundColor: getColor(index, items.length) }">
              </div>

              <!-- Item Input Field -->
              <input 
                v-model="items[index]" 
                type="text" 
                class="flex-1 bg-transparent border-none focus:outline-none text-sm text-slate-200 focus:text-white"
                placeholder="항목 이름..."
                @input="drawWheel"
              />

              <!-- Remove Button -->
              <button 
                @click="removeItem(index)" 
                class="text-slate-500 hover:text-rose-400 p-1 rounded-lg transition opacity-60 group-hover:opacity-100">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Bulk Textarea Input -->
        <div v-else class="flex flex-col flex-1">
          <textarea 
            v-model="bulkText" 
            @input="updateFromBulk"
            rows="8"
            placeholder="각 줄마다 항목을 하나씩 입력하세요.&#10;예시:&#10;한식&#10;중식&#10;일식&#10;양식"
            class="w-full flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-slate-100 transition resize-none">
          </textarea>
          <p class="text-xs text-slate-400 mt-2">
            <i class="fa-solid fa-circle-info mr-1"></i>줄바꿈으로 여러 항목을 한 번에 작성할 수 있습니다.
          </p>
        </div>

        <!-- Quick Clear & Randomize Actions -->
        <div class="mt-4 pt-4 border-t border-slate-700/50 flex justify-between items-center text-xs">
          <button 
            @click="shuffleItems" 
            class="text-slate-400 hover:text-indigo-300 transition flex items-center gap-1">
            <i class="fa-solid fa-shuffle"></i> 순서 섞기
          </button>
          <button 
            @click="clearAll" 
            class="text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
            <i class="fa-solid fa-trash-arrow-up"></i> 전체 삭제
          </button>
        </div>

      </div>

    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-slate-500 text-xs py-4">
      HTML5 Canvas & Vue.js & Tailwind CSS 기반 랜덤 룰렛 Web App
    </footer>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, watch } = Vue;

    createApp({
      setup() {
        const rouletteCanvas = ref(null);
        const inputMode = ref('list'); // 'list' | 'bulk'
        const items = ref(['짜장면', '짬뽕', '볶음밥', '탕수육', '마라탕', '돈까스', '초밥', '햄버거']);
        const newItemText = ref('');
        const bulkText = ref(items.value.join('\n'));
        const isSpinning = ref(false);
        const winner = ref(null);
        
        let currentAngle = 0; // Current rotation angle in radians
        let animationFrameId = null;

        // Filter out empty items
        const validItems = computed(() => {
          return items.value.map(i => i.trim()).filter(i => i.length > 0);
        });

        // Vibrant Color Palette Generator
        const getColor = (index, total) => {
          const hue = (index * (360 / Math.max(total, 1))) % 360;
          return `hsl(${hue}, 70%, 55%)`;
        };

        const getDarkerColor = (index, total) => {
          const hue = (index * (360 / Math.max(total, 1))) % 360;
          return `hsl(${hue}, 75%, 42%)`;
        };

        // Draw Roulette Wheel on Canvas
        const drawWheel = () => {
          const canvas = rouletteCanvas.value;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          const width = canvas.width;
          const height = canvas.height;
          const centerX = width / 2;
          const centerY = height / 2;
          const radius = width / 2 - 12;

          ctx.clearRect(0, 0, width, height);

          const itemList = validItems.value;
          const numItems = itemList.length;

          if (numItems === 0) {
            // Empty wheel state
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 16px Pretendard, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('항목을 추가해주세요', centerX, centerY);
            ctx.restore();
            return;
          }

          const sliceAngle = (Math.PI * 2) / numItems;

          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(currentAngle);

          // Draw Sectors
          for (let i = 0; i < numItems; i++) {
            const startAngle = i * sliceAngle;
            const endAngle = startAngle + sliceAngle;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, startAngle, endAngle);
            ctx.closePath();

            // Gradient sector fill for rich UI
            const grad = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius);
            grad.addColorStop(0, getColor(i, numItems));
            grad.addColorStop(1, getDarkerColor(i, numItems));

            ctx.fillStyle = grad;
            ctx.fill();

            // Divider lines
            ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Render Text
            ctx.save();
            const textAngle = startAngle + sliceAngle / 2;
            ctx.rotate(textAngle);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 4;

            // Font size auto-scale depending on item count
            let fontSize = 16;
            if (numItems > 16) fontSize = 11;
            else if (numItems > 10) fontSize = 13;
            
            ctx.font = `bold ${fontSize}px Pretendard, sans-serif`;

            // Truncate text if too long
            let text = itemList[i];
            if (text.length > 12) {
              text = text.substring(0, 10) + '...';
            }

            ctx.fillText(text, radius - 24, 0);
            ctx.restore();
          }

          // Outer border ring
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#334155';
          ctx.stroke();

          ctx.restore();
        };

        // Spin Logic
        const spinRoulette = () => {
          const itemList = validItems.value;
          if (isSpinning.value || itemList.length < 2) return;

          isSpinning.value = true;
          winner.value = null;

          const numItems = itemList.length;
          const sliceAngle = (Math.PI * 2) / numItems;

          // Target random item index
          const winnerIndex = Math.floor(Math.random() * numItems);
          
          // Pointer is at TOP (270deg or -90deg in standard canvas coords).
          // Pointer angle = -Math.PI / 2
          // Sector `i` center angle relative to wheel origin = `currentAngle + i * sliceAngle + sliceAngle / 2`
          // We want target sector center angle at top pointer:
          // (-Math.PI / 2) === currentAngle + winnerIndex * sliceAngle + sliceAngle / 2 (mod 2PI)
          
          const fullRounds = 5 + Math.floor(Math.random() * 5); // 5~9 full rotations
          const targetSectorAngle = winnerIndex * sliceAngle + sliceAngle / 2;
          
          // Calculate final angle
          // top pointer is at -Math.PI/2 (or 3Math.PI/2). To align targetSectorAngle to top pointer (-Math.PI/2),
          // finalAngle = -Math.PI/2 - targetSectorAngle + (fullRounds * Math.PI * 2)
          // Add a tiny random offset within the sector slice for realism
          const randomInSlice = (Math.random() - 0.5) * (sliceAngle * 0.7);
          const totalRotation = (fullRounds * Math.PI * 2) + (-Math.PI / 2 - targetSectorAngle) - randomInSlice;

          const startAngle = currentAngle;
          const deltaAngle = totalRotation - (startAngle % (Math.PI * 2));
          
          const duration = 4500; // 4.5 seconds animation
          const startTime = performance.now();

          // Cubic Ease-Out for realistic slowdown physics
          const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easedProgress = easeOutCubic(progress);

            currentAngle = startAngle + deltaAngle * easedProgress;
            drawWheel();

            if (progress < 1) {
              animationFrameId = requestAnimationFrame(animate);
            } else {
              isSpinning.value = false;
              winner.value = itemList[winnerIndex];
              triggerConfetti();
            }
          };

          animationFrameId = requestAnimationFrame(animate);
        };

        const triggerConfetti = () => {
          if (window.confetti) {
            confetti({
              particleCount: 100,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
        };

        const resetRotation = () => {
          if (isSpinning.value) return;
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          currentAngle = 0;
          winner.value = null;
          drawWheel();
        };

        const addItem = () => {
          if (!newItemText.value.trim()) return;
          items.value.push(newItemText.value.trim());
          newItemText.value = '';
          bulkText.value = items.value.join('\n');
          drawWheel();
        };

        const removeItem = (index) => {
          items.value.splice(index, 1);
          bulkText.value = items.value.join('\n');
          drawWheel();
        };

        const updateFromBulk = () => {
          items.value = bulkText.value.split('\n');
          drawWheel();
        };

        const clearAll = () => {
          items.value = [];
          bulkText.value = '';
          winner.value = null;
          drawWheel();
        };

        const shuffleItems = () => {
          items.value = [...items.value].sort(() => Math.random() - 0.5);
          bulkText.value = items.value.join('\n');
          drawWheel();
        };

        const setPreset = (type) => {
          if (type === 'food') {
            items.value = ['짜장면', '짬뽕', '제육볶음', '김치찌개', '돈까스', '초밥', '햄버거', '마라탕', '샐러드'];
          } else if (type === 'penalty') {
            items.value = ['엉덩이 이름쓰기', '노래 한 곡', '다음 사람이 사주기', '딱밤 한 대', '통과', '애교 3종 세트'];
          }
          bulkText.value = items.value.join('\n');
          drawWheel();
        };

        watch(items, () => {
          drawWheel();
        }, { deep: true });

        onMounted(() => {
          drawWheel();
          window.addEventListener('resize', drawWheel);
        });

        return {
          rouletteCanvas,
          inputMode,
          items,
          newItemText,
          bulkText,
          validItems,
          isSpinning,
          winner,
          getColor,
          drawWheel,
          spinRoulette,
          resetRotation,
          addItem,
          removeItem,
          updateFromBulk,
          clearAll,
          shuffleItems,
          setPreset
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
